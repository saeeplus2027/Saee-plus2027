name: Deploy Saee Plus to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Verify public website files
        run: |
          test -f public/index.html
          test -f public/app.js
          test -f public/admin.js
          test -f public/style.css
          test -f public/remote-config.js

      - name: Upload website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Wait for Pages artifact metadata to propagate
        run: sleep 10

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
