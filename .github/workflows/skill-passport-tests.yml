name: Skill Passport Security Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-skill-passport:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify JavaScript syntax
        run: |
          node --check public/skill-passport.js
          node --check lib/skill-passport-validation.mjs
          node --check tests/skill-passport-security.test.mjs
          node --check tests/skill-passport-client.test.mjs
      - name: Run security validation tests
        run: node tests/skill-passport-security.test.mjs
      - name: Run client recovery tests
        run: node tests/skill-passport-client.test.mjs
      - name: Test migration and row isolation
        run: python3 tests/test_skill_passport_migration.py
