name: Deploy Saee Plus to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # The live root index.html loads CSS, JavaScript and assets from
      # the public/ directory. Stage public/ at the Pages root and then
      # replace its older index with the current root index.html.
      - name: Prepare GitHub Pages files
        run: |
          rm -rf _site
          mkdir -p _site
          cp -a public/. _site/
          cp index.html _site/index.html

      - name: Upload website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
